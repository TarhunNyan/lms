server:
  port: 8085

spring:
  config:
    import: file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.boot.context.config: TRACE
    liquibase: DEBUG
    org.sg01.example.lms: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: env,health,info,metrics,beans,mappings,loggers
  endpoint:
    health:
      show-details: always